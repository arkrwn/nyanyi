name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --verbose

      - name: Package Nyanyi.app and Nyanyi.dmg
        run: ./package.sh --dmg

      - name: Upload Nyanyi.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyanyi-macOS
          path: |
            Nyanyi.dmg
            Nyanyi.app
