name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --verbose

      - name: Package Nyanyi.app and Nyanyi.dmg
        run: |
          ./package.sh --dmg
          ditto -c -k --sequesterRsrc --keepParent Nyanyi.app Nyanyi-macOS.zip

      - name: Upload Nyanyi.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyanyi-macOS
          path: |
            Nyanyi.dmg
            Nyanyi-macOS.zip

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" Nyanyi.dmg Nyanyi-macOS.zip --clobber
          else
            gh release create "$TAG_NAME" Nyanyi.dmg Nyanyi-macOS.zip \
              --title "Nyanyi ${TAG_NAME}" \
              --generate-notes
          fi
